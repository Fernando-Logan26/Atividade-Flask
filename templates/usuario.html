{% extends 'base.html' %}

{% block conteudo %}
    <h2>Perfil do Cliente</h2>
    <p>
        <img class="imgquadrada" src="{{ url_for('static', filename='img/logo.png') }}" alt="Foto de Perfil">
        <br><br>
        <b>Nome:</b> {{ nome if nome else dados.get('nome', 'Cliente NOKIS') }}<br/>
        {% if dados %}
            <b>Status:</b> {{ dados.get('profissao', 'Membro VIP') }}<br/>
            <b>Preferência:</b> {{ dados.get('disciplina', 'Streetwear Monocromático') }}
        {% endif %}
    </p>
{% endblock %}

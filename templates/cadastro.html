{% extends 'base.html' %}

{% block conteudo %}
    <h2>Criar Conta NOKIS</h2>

    <p>Preencha os dados abaixo para fazer parte da comunidade NOKIS:</p>

    <form action="/salvarcadastro" method="POST">
        <label for="nome_usuario">Nome de Usuário:</label><br>
        <input type="text" id="nome_usuario" name="nome_usuario" value="{{ nome_login if nome_login else '' }}" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha" required><br><br>

        <button type="submit">Finalizar Cadastro</button>
    </form>

    <br>
    <a href="{{ url_for('login') }}">Já possui conta? Faça login</a>
{% endblock %}

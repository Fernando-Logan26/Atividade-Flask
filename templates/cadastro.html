{% extends 'base.html' %}

{% block title %}Cadastro - NOKIS{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Criar Conta NOKIS</h2>
    <p style="margin-bottom: 20px; color: #aaa;">Preencha os dados abaixo para fazer parte da comunidade NOKIS:</p>

    <form action="{{ url_for('cadastro') }}" method="POST">
        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <button type="submit" class="btn">Finalizar Cadastro</button>
    </form>

    <br>
    <p style="text-align: center;"><a href="{{ url_for('login') }}" style="color: #fff;">Já possui conta? Faça login</a></p>
</div>
{% endblock %}
